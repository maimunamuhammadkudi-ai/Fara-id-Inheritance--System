<style>
/* Fara'id inheritance interface */

:root {
  color-scheme: light;
  --ink: #20352e;
  --muted: #68776f;
  --forest: #174536;
  --forest-deep: #10372b;
  --leaf: #dce9df;
  --gold: #e2b45b;
  --paper: #f2f5f1;
  --surface: #ffffff;
  --line: #dce4de;
  --focus: #2f765b;
  --success-bg: #e5f3e8;
  --success-ink: #205c36;
  --error-bg: #fbe9e7;
  --error-ink: #8d3029;
  --info-bg: #e6f1f2;
  --info-ink: #245c63;
  --warning-bg: #fff4dc;
  --warning-ink: #765515;
}

* {
  box-sizing: border-box;
}

html {
  min-width: 320px;
  background: var(--paper);
}

body {
  margin: 0;
  color: var(--ink);
  background: var(--paper);
  font-family: "Aptos", "Trebuchet MS", sans-serif;
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

.container {
  width: min(1080px, calc(100% - 48px));
  margin: 34px auto 64px;
}

.header {
  position: relative;
  overflow: hidden;
  padding: 34px 40px 30px;
  margin-bottom: 22px;
  color: #f8fbf7;
  background: var(--forest-deep);
  border-radius: 8px;
  border-bottom: 4px solid var(--gold);
}

.header h1 {
  max-width: 760px;
  margin: 0 0 8px;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 34px;
  font-weight: 600;
  line-height: 1.18;
}

.header p {
  margin: 5px 0;
}

.header-subtitle {
  color: #d6e4dc;
  font-size: 15px;
}

.developer-profile {
  max-width: 740px;
  padding-top: 16px;
  margin-top: 20px;
  border-top: 1px solid rgba(255, 255, 255, 0.2);
  line-height: 1.5;
}

.developer-profile .name {
  color: #ffffff;
  font-size: 17px;
  font-weight: 700;
}

.developer-profile .company {
  color: #e8c77f;
  font-weight: 600;
}

.developer-profile .role,
.developer-profile .mentor {
  color: #d6e4dc;
  font-size: 13px;
}

.notice {
  padding: 16px 20px;
  margin-bottom: 20px;
  color: var(--warning-ink);
  background: var(--warning-bg);
  border: 1px solid #f0d99e;
  border-left: 4px solid var(--gold);
  border-radius: 4px;
  line-height: 1.65;
}

.card {
  padding: 25px 28px 27px;
  margin-bottom: 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  box-shadow: 0 3px 12px rgba(27, 54, 42, 0.035);
}

.card h2 {
  padding-bottom: 12px;
  margin: 0 0 18px;
  color: var(--forest);
  border-bottom: 1px solid var(--line);
  font-family: Georgia, "Times New Roman", serif;
  font-size: 21px;
  font-weight: 600;
  line-height: 1.3;
}

.card h3 {
  margin: 24px 0 10px;
  color: var(--forest);
  font-size: 16px;
}

.card > p {
  margin: 0 0 16px;
  color: var(--muted);
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px 20px;
}

.field {
  display: flex;
  min-width: 0;
  flex-direction: column;
}

.field.full {
  grid-column: 1 / -1;
}

label {
  margin-bottom: 6px;
  color: #344b40;
  font-size: 13px;
  font-weight: 700;
}

input,
select,
button {
  font: inherit;
}

input,
select {
  width: 100%;
  min-height: 44px;
  padding: 9px 12px;
  color: var(--ink);
  background: #fff;
  border: 1px solid #cbd7cf;
  border-radius: 4px;
  transition: border-color 140ms ease, box-shadow 140ms ease;
}

input::placeholder {
  color: #89968e;
}

input:hover,
select:hover {
  border-color: #91a99a;
}

input:focus-visible,
select:focus-visible,
button:focus-visible {
  outline: 3px solid rgba(47, 118, 91, 0.24);
  outline-offset: 2px;
  border-color: var(--focus);
}

.heir-row {
  display: grid;
  grid-template-columns: minmax(180px, 1.6fr) minmax(130px, 1fr) minmax(90px, 0.65fr) auto;
  gap: 12px;
  align-items: end;
  padding: 14px 0;
  border-bottom: 1px solid #e8eeea;
}

.heir-row:first-child {
  padding-top: 2px;
}

button {
  min-height: 42px;
  padding: 9px 16px;
  cursor: pointer;
  border: 1px solid transparent;
  border-radius: 4px;
  font-weight: 700;
  transition: background-color 140ms ease, border-color 140ms ease, transform 140ms ease;
}

button:active {
  transform: translateY(1px);
}

button:disabled {
  cursor: wait;
  opacity: 0.65;
}

.btn-primary {
  color: #fff;
  background: var(--forest);
}

.btn-primary:hover:not(:disabled) {
  background: #205b45;
}

.btn-secondary {
  color: var(--forest);
  background: var(--leaf);
  border-color: #cbdccf;
}

.btn-secondary:hover:not(:disabled) {
  background: #cfe0d3;
}

.btn-danger {
  color: var(--error-ink);
  background: #fff3f1;
  border-color: #f0d2ce;
}

.btn-danger:hover:not(:disabled) {
  background: var(--error-bg);
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 17px;
}

.status {
  display: none;
  padding: 12px 15px;
  margin-bottom: 16px;
  border: 1px solid transparent;
  border-radius: 4px;
  font-weight: 600;
}

.status.success {
  display: block;
  color: var(--success-ink);
  background: var(--success-bg);
  border-color: #c6e3cc;
}

.status.error {
  display: block;
  color: var(--error-ink);
  background: var(--error-bg);
  border-color: #f0d0cc;
}

.status.info {
  display: block;
  color: var(--info-ink);
  background: var(--info-bg);
  border-color: #c9e0e2;
}

.results-summary {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 22px;
}

.summary-box {
  min-width: 0;
  padding: 15px 17px;
  background: #f5f8f5;
  border: 1px solid var(--line);
  border-top: 3px solid #9cb5a2;
  border-radius: 4px;
}

.summary-box:first-child {
  border-top-color: var(--gold);
}

.summary-label {
  margin-bottom: 5px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
}

.summary-value {
  overflow-wrap: anywhere;
  color: var(--forest-deep);
  font-size: 20px;
  font-weight: 700;
  line-height: 1.3;
}

.table-wrapper {
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: 4px;
  -webkit-overflow-scrolling: touch;
}

table {
  width: 100%;
  min-width: 750px;
  border-collapse: collapse;
  background: #fff;
}

th,
td {
  padding: 11px 13px;
  text-align: left;
  vertical-align: top;
  border-bottom: 1px solid #e6ece8;
}

th {
  color: #344b40;
  background: #eef3ef;
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
}

tbody tr:last-child td {
  border-bottom: 0;
}

tbody tr:hover {
  background: #f8faf8;
}

.eligible {
  color: var(--success-ink);
  font-weight: 700;
}

.warning {
  color: var(--warning-ink);
  font-weight: 700;
}

.explanation {
  padding: 13px 15px;
  margin-top: 10px;
  color: #46594e;
  background: #f3f7f3;
  border-left: 3px solid #88a894;
  border-radius: 0 4px 4px 0;
  line-height: 1.65;
}

.disclaimer {
  padding: 16px 18px;
  margin-top: 22px;
  color: #704b1b;
  background: #fff5e7;
  border: 1px solid #f0d8b2;
  border-left: 4px solid #d58a3a;
  border-radius: 4px;
  line-height: 1.65;
}

.hidden {
  display: none !important;
}

.loading {
  opacity: 0.65;
  pointer-events: none;
}

@media (max-width: 720px) {
  .container {
    width: min(100% - 28px, 560px);
    margin: 14px auto 36px;
  }

  .header {
    padding: 27px 22px 23px;
  }

  .header h1 {
    font-size: 28px;
  }

  .card {
    padding: 20px 18px 22px;
  }

  .grid {
    grid-template-columns: minmax(0, 1fr);
    gap: 15px;
  }

  .field.full {
    grid-column: auto;
  }

  .heir-row {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    padding: 14px 0;
  }

  .heir-row .btn-danger {
    grid-column: 1 / -1;
    justify-self: start;
  }

  .results-summary {
    grid-template-columns: 1fr;
    gap: 9px;
  }
}

@media (max-width: 420px) {
  .container {
    width: calc(100% - 20px);
  }

  .header {
    padding: 23px 17px 20px;
  }

  .header h1 {
    font-size: 25px;
  }

  .card {
    padding: 18px 14px 20px;
  }

  .actions > button {
    width: 100%;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
  }
}
</style>
